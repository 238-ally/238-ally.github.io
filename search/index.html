<script>
document.addEventListener('DOMContentLoaded', async function() {
  const input = document.getElementById('local-search-input');
  const resultEl = document.getElementById('local-search-result');

  const res = await fetch('/search.json');
  const LOCAL_SEARCH_DATA = await res.json();
  console.log(LOCAL_SEARCH_DATA); // ✅ 这里可以看数据

  input.addEventListener('input', function() {
    const keyword = this.value.trim().toLowerCase();
    const results = LOCAL_SEARCH_DATA.filter(post =>
      post.title.toLowerCase().includes(keyword) ||
      (post.content && post.content.toLowerCase().includes(keyword))
    );
    resultEl.innerHTML = results.length
      ? results.map(post => `<li><a href="${post.url}">${post.title}</a></li>`).join('')
      : '<li class="no-result">没有搜索结果</li>';
  });
});
</script>
